[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aerospace-workbench"
dynamic = ["version"]
description = "ASTARA Engineering Workbench simulation and SIL tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "rocketpy>=1.13,<2",
]

[project.scripts]
awb = "aerospace_workbench.application.cli:main"
aerospace-workbench = "aerospace_workbench.application.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "aerospace_workbench.__version__"}
