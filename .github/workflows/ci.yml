name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: cmake -S flight_core -B flight_core/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build flight_core/build --parallel
      - run: ctest --test-dir flight_core/build --output-on-failure
